# =========================================================
# Tham số nghiệp vụ - Baseline V6 (mục 18 - Quyết định đã khóa)
# =========================================================

# BR-05: pickup_time tối thiểu 30 phút sau checkout
business.pickup.minLeadMinutes=30

# BR-08: kitchen_release_at = pickup_time - 20 phút
business.kitchen.prepLeadMinutes=20

# BR-13: Online PENDING_PAYMENT không PAID trong 15 phút -> EXPIRED
business.payment.expiryMinutes=15

# BR-17: READY quá pickup_time + 30 phút -> UI flag OVERDUE (không auto cancel)
business.pickup.overdueMinutes=30

# Pickup Code (UC-15)
business.pickupCode.length=6

# Giờ mở cửa. Khách chỉ hẹn giờ lấy hàng trong khung này, và giờ hẹn sớm nhất còn phải
# lùi thêm prepLeadMinutes để đơn không bị đẩy xuống bếp trước lúc mở cửa.
business.store.openHour=7
business.store.closeHour=21

# =========================================================
# Scheduler (NFR-03: release trong vòng 60s kể từ kitchen_release_at)
# =========================================================
scheduler.kitchenRelease.intervalSeconds=30
scheduler.paymentExpiry.intervalSeconds=60

# =========================================================
# Payment Gateway (sandbox / adapter - mục 12)
# =========================================================
payment.gateway.provider=MOCK
payment.gateway.returnUrl=http://localhost:8080/fastfood/payment/callback
payment.gateway.merchantId=SANDBOX_MERCHANT
payment.gateway.secretKey=SANDBOX_SECRET

# =========================================================
# Notification (ORDER_CONFIRMED / ORDER_READY - module 6)
# =========================================================
notification.channel=MOCK
notification.mail.host=smtp.gmail.com
notification.mail.port=587
notification.mail.username=
notification.mail.password=

# =========================================================
# KDS realtime (NFR-04: item xuất hiện trên KDS trong 2 giây)
# =========================================================
kds.poll.intervalMillis=2000

# =========================================================
# Xác thực và phiên đăng nhập (xem docs/STRUCTURE.md mục 5)
#
# Mọi giá trị ở đây đều có mặc định trong mã, nên xoá cả khối này ứng dụng vẫn chạy đúng
# như cũ. Chúng nằm ngoài file để chỉnh được lúc trình bày mà không phải dịch lại.
# =========================================================

# Bao lâu soi lại tài khoản trong cơ sở dữ liệu một lần, để việc khoá hay hạ quyền có hiệu
# lực ngay thay vì đợi hết phiên. Yêu cầu GHI thì luôn soi lại, không đợi hết nhịp này.
security.session.revalidateSeconds=30

# Chống dò mật khẩu. Đếm theo cặp email + địa chỉ máy, không đếm theo mình email — đếm theo
# email thì bất kỳ ai cũng khoá được tài khoản người khác bằng cách gõ sai vài lần.
security.login.maxAttempts=5
security.login.lockMinutes=15
security.login.windowMinutes=15

# Luồng quên mật khẩu. Hạn ngắn để một liên kết bị lộ không nằm chờ được lâu; số lần xin
# có trần để chức năng này không thành công cụ dội thư vào hộp thư người khác.
security.reset.expiryMinutes=15
security.reset.maxRequests=3
security.reset.windowMinutes=15
